name: Сборка и публикация сайта

# Сборка проверяет заодно две вещи, из-за которых учебники обычно гниют:
# формат исходников и все внутренние ссылки (плагин starlight-links-validator).
# Битая ссылка роняет сборку и не доезжает до читателя.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить форматирование
        run: npm run format:check

      - name: Собрать сайт
        run: npm run build

      - name: Настроить GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Загрузить артефакт
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Опубликовать
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Развернуть на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
