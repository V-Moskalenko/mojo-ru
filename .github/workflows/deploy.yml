name: Сборка и публикация сайта

# Сборка проверяет заодно две вещи, из-за которых учебники обычно гниют:
# формат исходников и все внутренние ссылки (плагин starlight-links-validator).
# Битая ссылка роняет сборку и не доезжает до читателя.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # полная история нужна для дат «обновлено» на страницах и lastmod в карте сайта
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить форматирование
        run: npm run format:check

      - name: Собрать сайт
        run: npm run build

      - name: Настроить GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Загрузить артефакт
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Опубликовать
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Развернуть на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Сообщить поисковикам
    # Яндекс и Bing узнают об изменённых главах сразу, а не при следующем
    # обходе. Только для настоящего push: у ручного запуска нет «предыдущего
    # коммита», от которого считать изменения.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Достать собранный сайт
        uses: actions/download-artifact@v5
        with:
          name: github-pages
          path: artifact

      - name: Отправить изменённые страницы в IndexNow
        # Ошибка здесь не должна краснить публикацию: сайт уже выложен,
        # а робот всё равно придёт по карте сайта.
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          mkdir -p dist && tar -xf artifact/artifact.tar -C dist
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            export INDEXNOW_SINCE="$(git show -s --format=%cI "$BEFORE")"
          fi
          node scripts/indexnow.mjs
