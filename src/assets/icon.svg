<!--
  Иконка приложения: то же пламя, что и в логотипе, но на тёмной подложке.

  Зачем подложка. Логотип в шапке живёт на фоне сайта, и прозрачное пламя
  там уместно. А иконку браузер и поисковик рисуют размером 16–32 пикселя
  на чужом фоне — в выдаче Google он белый. Тонкое пламя без подложки
  на таком фоне почти не читается, поэтому здесь оно на скруглённом
  тёмном квадрате.

  Отсюда генерируются favicon.ico, apple-touch-icon и иконки для Android:
    node scripts/make-icons.mjs
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241B14" />
      <stop offset="1" stop-color="#14110F" />
    </linearGradient>
    <linearGradient id="flame" x1="16" y1="2" x2="16" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB067" />
      <stop offset=".55" stop-color="#FF7A2F" />
      <stop offset="1" stop-color="#D4530B" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#plate)" />
  <rect
    x="4"
    y="4"
    width="504"
    height="504"
    rx="110"
    fill="none"
    stroke="#FF7A2F"
    stroke-opacity=".22"
    stroke-width="8"
  />

  <g transform="translate(48 84) scale(13)">
    <path
      fill="url(#flame)"
      d="M16.6 2.2c.4 3.6-1.1 5.6-3 7.6-2.2 2.3-4.8 4.5-4.8 8.7 0 4.1 3.2 7.5 7.2 7.5s7.2-3.4 7.2-7.5c0-2.6-1-4.3-2.3-6 .2 1.6-.4 2.9-1.4 3.6.3-3.6-1.1-6.3-2.9-8.4-1-1.2-.9-3.4 0-5.5Z"
    />
    <path
      fill="#FFE0C4"
      d="M16 15.5c1.7 1.6 2.6 3 2.6 4.6 0 1.7-1.2 3-2.6 3s-2.6-1.3-2.6-3c0-1.6.9-3 2.6-4.6Z"
    />
  </g>
</svg>
